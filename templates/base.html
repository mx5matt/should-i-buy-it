<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>{% block title %}{{ app_title }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('index') }}">
    <span class="mark">{{ app_initials }}</span>
    <span class="brand-text"><strong>{{ app_title }}</strong><small>v{{ app_version }}</small></span>
  </a>
  <nav>
    <a href="{{ url_for('index') }}">Home</a>
    <a href="{{ url_for('changelog') }}">Changelog</a>
  </nav>
</header>
<main>
  {% with messages = get_flashed_messages() %}
    {% for message in messages %}<div class="notice">{{ message }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer>{{ app_title }} v{{ app_version }} &middot; <a href="{{ url_for('changelog') }}">Changelog</a></footer>
<script defer src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
